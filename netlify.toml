# Static site: no build step, publish the repository root.
# The explicit command overrides any build command left in Netlify's UI settings.
[build]
  command = "echo 'Static site: nothing to build'"
  publish = "."

# Basic security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Short URLs. Pages live at /insights/<name>.html but are linked as /insights/<name>;
# these rewrites serve the .html file for the clean address (status 200 keeps the URL).
[[redirects]]
  from = "/insights/:name"
  to = "/insights/:name.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/standards"
  to = "/standards.html"
  status = 200

[[redirects]]
  from = "/subscribed"
  to = "/subscribed.html"
  status = 200

[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200

